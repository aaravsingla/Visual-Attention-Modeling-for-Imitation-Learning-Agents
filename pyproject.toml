[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-attention-imitation"
version = "0.1.0"
description = "Visual attention modeling for imitation learning: a lightweight simulation of reading behaviour"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "pillow>=10.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
